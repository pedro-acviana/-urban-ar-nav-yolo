<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8f98"/>
    </marker>
    <style>
      .box  { fill:#f4f6f8; stroke:#c8cdd4; stroke-width:1.5; rx:8; }
      .in   { fill:#e8f1fb; stroke:#7fa8d4; }
      .out  { fill:#e7f6ec; stroke:#6fbb8a; }
      .n    { font-size:11px; fill:#8a8f98; }
      .t    { font-size:13px; font-weight:600; fill:#1f2933; }
      .s    { font-size:11px; fill:#5a6472; }
      .link { stroke:#8a8f98; stroke-width:1.6; fill:none; marker-end:url(#a); }
    </style>
  </defs>

  <!-- entradas -->
  <rect class="box in" x="12" y="30" width="128" height="52" rx="8"/>
  <text class="t" x="76" y="52" text-anchor="middle">GPX</text>
  <text class="s" x="76" y="69" text-anchor="middle">lat, lon, tempo</text>

  <rect class="box in" x="12" y="124" width="128" height="52" rx="8"/>
  <text class="t" x="76" y="146" text-anchor="middle">vídeo</text>
  <text class="s" x="76" y="163" text-anchor="middle">frame do motorista</text>

  <rect class="box in" x="12" y="218" width="128" height="52" rx="8"/>
  <text class="t" x="76" y="240" text-anchor="middle">calibração</text>
  <text class="s" x="76" y="257" text-anchor="middle">K, distorção</text>

  <!-- módulos -->
  <rect class="box" x="182" y="24" width="150" height="64" rx="8"/>
  <text class="n" x="192" y="41">1</text>
  <text class="t" x="257" y="52" text-anchor="middle">GPS → ENU</text>
  <text class="s" x="257" y="70" text-anchor="middle">heading, velocidade</text>

  <rect class="box" x="182" y="118" width="150" height="64" rx="8"/>
  <text class="n" x="192" y="135">2</text>
  <text class="t" x="257" y="146" text-anchor="middle">sincronização</text>
  <text class="s" x="257" y="164" text-anchor="middle">rota no veículo</text>

  <rect class="box" x="182" y="212" width="150" height="64" rx="8"/>
  <text class="n" x="192" y="229">3</text>
  <text class="t" x="257" y="240" text-anchor="middle">pose R, t</text>
  <text class="s" x="257" y="258" text-anchor="middle">altura, pitch, yaw</text>

  <rect class="box" x="374" y="118" width="150" height="64" rx="8"/>
  <text class="n" x="384" y="135">4</text>
  <text class="t" x="449" y="146" text-anchor="middle">YOLOPv2</text>
  <text class="s" x="449" y="164" text-anchor="middle">área dirigível</text>

  <rect class="box" x="566" y="94" width="164" height="112" rx="8"/>
  <text class="n" x="576" y="111">5</text>
  <text class="t" x="648" y="126" text-anchor="middle">bird's-eye view</text>
  <text class="s" x="648" y="146" text-anchor="middle">H = K·[r₁|r₂|t]</text>
  <text class="s" x="648" y="164" text-anchor="middle">corredor dirigível</text>
  <text class="s" x="648" y="182" text-anchor="middle">rota ⟶ centro da via</text>

  <rect class="box" x="772" y="118" width="150" height="64" rx="8"/>
  <text class="n" x="782" y="135">6</text>
  <text class="t" x="847" y="146" text-anchor="middle">projeção</text>
  <text class="s" x="847" y="164" text-anchor="middle">spline + oclusão</text>

  <rect class="box out" x="772" y="212" width="150" height="58" rx="8"/>
  <text class="t" x="847" y="238" text-anchor="middle">faixa AR</text>
  <text class="s" x="847" y="255" text-anchor="middle">sobre o asfalto</text>

  <!-- ligações -->
  <path class="link" d="M140 56 H176"/>
  <path class="link" d="M332 56 V138 H370"/>
  <path class="link" d="M140 150 H176"/>
  <path class="link" d="M332 150 H370"/>
  <path class="link" d="M140 244 H176"/>
  <path class="link" d="M332 244 H556 V202"/>
  <path class="link" d="M524 150 H562"/>
  <path class="link" d="M730 150 H768"/>
  <path class="link" d="M847 182 V208"/>
  <path class="link" d="M332 244 H556 V202"/>
</svg>
